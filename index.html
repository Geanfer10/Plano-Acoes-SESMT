<title>Plano de Ações SESMT – Goiás Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --line:#E4E9E3; --txt:#15211A; --sub:#66746B; --mute:#9AA69E;
  --brand:#14532D; --brand2:#1E7B3C; --brand3:#E7F2EA;
  --ok:#1E9350; --and:#2E6FD9; --atr:#D64545; --warn:#D9861C;
  --ink:#0F1F17; --ink2:#182C21; --ink3:#24392D; --inktxt:#E8F0EA; --inksub:#8FA597;
  --r:20px; --mono:"JetBrains Mono",Consolas,monospace;
  --sh:0 1px 2px rgba(16,40,24,.04),0 4px 16px rgba(16,40,24,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
button{font-family:inherit}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,241,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff}
.brand h1{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.brand p{font-size:12px;color:var(--sub)}
.nav{display:flex;gap:4px;background:#E7ECE6;padding:4px;border-radius:12px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--txt)}
.nav button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stamp{font-size:12px;color:var(--sub);text-align:right;line-height:1.4}
.stamp b{color:var(--txt);font-weight:600}

main{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:28px;font-weight:800;letter-spacing:-.8px}
.head p{color:var(--sub);margin-top:4px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--txt);box-shadow:var(--sh)}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2);color:#fff}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.tile.dark{background:var(--ink);border-color:var(--ink);color:var(--inktxt)}
.tile h3{font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.tile.dark h3{color:var(--inksub)}
.tile h3 small{font-weight:500;font-size:11.5px;color:var(--mute)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.click{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.click:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,40,24,.09);border-color:#C9D6CC}

/* hero */
.tile.heroT{display:flex;align-items:center}
.hero{width:100%;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{position:relative;width:168px;height:168px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-size:38px;font-weight:700;color:#fff;display:block;line-height:1}
.ring .in span{font-size:11.5px;color:var(--inksub);margin-top:6px;display:block}
.hero .lbl{font-size:13px;color:var(--inksub);font-weight:500}
.hero .big{font-size:64px;font-weight:700;color:#fff;line-height:1;margin:6px 0 4px}
.hero .cap{color:var(--inksub);font-size:13px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:18px 0 12px;background:var(--ink3)}
.stack span{height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--inksub)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.leg b{color:#fff;font-family:var(--mono);margin-left:4px}

/* kpi */
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-bottom:14px}
.kpi .lb{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .v{font-size:40px;font-weight:700;color:var(--txt);line-height:1.05;margin:4px 0 2px}
.kpi .p{font-size:12.5px;color:var(--c);font-weight:600}
.kpi .d{font-size:12px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.kpi .d b{color:var(--txt);font-family:var(--mono)}
.kpi .go{position:absolute;top:20px;right:20px;color:var(--mute);font-size:12px;font-weight:600;opacity:0;transition:.15s}
.kpi:hover .go{opacity:1;color:var(--c)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}

/* comissões */
.org{display:grid;grid-template-columns:1fr 160px 56px;gap:14px;align-items:center;padding:12px 10px;border-radius:12px}
.org+.org{border-top:1px solid var(--line)}
.org.click:hover{transform:none;box-shadow:none;background:#F6F8F5}
.org .t{font-weight:600;font-size:14px}
.org .s{font-size:12px;color:var(--sub);margin-top:2px}
.org .s b{font-family:var(--mono);font-weight:700}
.mini{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#EDF1EC}
.org .pc{font-family:var(--mono);font-weight:700;text-align:right;font-size:15px}

/* movimentação */
.mv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mv div{background:var(--ink2);border-radius:14px;padding:14px}
.mv .l{font-size:12px;color:var(--inksub);font-weight:500}
.mv .n{font-size:30px;font-weight:700;margin-top:4px}
.mv .s{font-size:11px;color:var(--inksub);margin-top:2px}
.sel{font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--ink3);background:var(--ink2);color:var(--inktxt);font-family:inherit}

/* departamentos */
.dp{display:grid;grid-template-columns:minmax(120px,190px) 1fr 40px;gap:12px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer}
.dp:hover{background:#F3F6F2}
.dp .n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .b{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#F0F3EF}
.dp .b span{height:100%}
.dp .v{font-family:var(--mono);font-weight:700;text-align:right}

/* atenção */
.alert{display:flex;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.alert:first-of-type{border-top:0;padding-top:0}
.alerts2{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.alerts2 .alert:nth-of-type(2){border-top:0;padding-top:0}
@media(max-width:900px){.alerts2{grid-template-columns:1fr}.alerts2 .alert:nth-of-type(2){border-top:1px solid var(--line);padding-top:12px}}
.alert:hover .at{color:var(--brand)}
.alert .dd{min-width:58px;height:42px;border-radius:10px;background:#FCEDED;color:var(--atr);display:grid;place-items:center;text-align:center;line-height:1}
.alert .dd b{font-family:var(--mono);font-size:15px;display:block}
.alert .dd small{font-size:9.5px;font-weight:600}
.alert .at{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert .am{font-size:11.5px;color:var(--sub);margin-top:3px}
.empty{color:var(--sub);font-size:13px;padding:20px 0;text-align:center}

/* gaveta */
.ov{position:fixed;inset:0;background:rgba(10,25,16,.35);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.dr.on{transform:none}
.dr-h{padding:22px 26px 16px;background:#fff;border-bottom:1px solid var(--line)}
.dr-h .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-h h4{font-size:20px;font-weight:800;letter-spacing:-.4px}
.dr-h p{font-size:13px;color:var(--sub);margin-top:3px}
.x{border:0;background:#EEF2ED;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;color:var(--sub)}
.x:hover{background:#E1E8E0;color:var(--txt)}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#EEF2ED;padding:3px;border-radius:10px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button .k{font-family:var(--mono);font-size:11.5px;margin-left:5px;opacity:.75}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;background:#fff}
.search:focus{outline:2px solid var(--brand3);border-color:var(--brand2)}
.fsel{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;background:#fff;max-width:220px}
.dr-b{flex:1;overflow:auto;padding:16px 26px 30px}
.cnt{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.ac{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.ac .ttl{font-weight:600;font-size:13.5px;line-height:1.4}
.ac .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sub)}
.ac .meta b{color:var(--txt);font-weight:600}
.ac .obs{grid-column:1/-1;font-size:12px;color:var(--sub);background:#F6F8F5;border-radius:8px;padding:7px 10px;margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;height:fit-content}
.p-ok{background:#E3F4EA;color:var(--ok)}.p-and{background:#E6EEFB;color:var(--and)}.p-atr{background:#FBE7E7;color:var(--atr)}.p-sd{background:#FDF1E0;color:var(--warn)}
.tag{font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand3);padding:2px 7px;border-radius:6px;margin-right:6px}

.idbig{font-size:14px;color:var(--sub);margin:-4px 0 14px}
.idbig span{font-size:30px;font-weight:700;color:#C93C3C;margin-right:6px}
.stackL{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#F0F3EF;margin-bottom:14px}
.stackL span{height:100%}
.idr{display:grid;grid-template-columns:12px 1fr auto 44px;gap:10px;align-items:center;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:13px}
.idr:hover{background:#F3F6F2}
.idr i{width:10px;height:10px;border-radius:3px}
.idr b{font-size:15px}
.idr em{font-style:normal;color:var(--mute);font-size:12px;text-align:right}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.loc{padding:7px 8px;border-radius:9px;cursor:pointer}
.loc:hover{background:#F3F6F2}
.loc .ln{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;margin-bottom:6px;gap:8px}
.loc .ln span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .lb{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#F0F3EF}
.loc .lb span{height:100%}
.tag.hist{background:#EEF0F3;color:#5A6472}
@media(max-width:640px){.locs{grid-template-columns:1fr}}
.fbar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.fgrp{display:flex;align-items:center;gap:8px}
.flb{font-size:12px;font-weight:600;color:var(--sub)}
.fdate{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px;background:#fff;color:var(--txt)}
.flimpa{border:0;background:#FDECEC;color:var(--atr);font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer;margin-left:auto}
.finfo{flex-basis:100%;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.finfo b{color:var(--txt)}
.foot{margin-top:22px;font-size:11.5px;color:var(--mute);line-height:1.6}
@media(max-width:1180px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.nav{margin-left:0;overflow-x:auto;max-width:100%}}
@media(max-width:640px){main,.top-in{padding-left:16px;padding-right:16px}.c3{grid-column:span 12}.hero{grid-template-columns:1fr}.org{grid-template-columns:1fr 70px 48px}}

/* ================= GLASSY CLARO ================= */
:root{
  --bg:#EEF6F1; --card:rgba(255,255,255,.55); --line:rgba(255,255,255,.75);
  --txt:#12261B; --sub:#4E6457; --mute:#8197A0;
  --brand:#167A44; --brand2:#1E9350; --brand3:rgba(30,147,80,.12);
  --ink:rgba(255,255,255,.55); --ink2:rgba(255,255,255,.6); --ink3:rgba(18,38,27,.08);
  --inktxt:#12261B; --inksub:#4E6457;
  --glass-b:blur(24px) saturate(170%);
  --sh:inset 0 1px 0 rgba(255,255,255,.9), 0 8px 32px rgba(31,80,55,.10);
  --r:24px;
}
body{background:#EEF6F1;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#E9F7EF 0%,#EAF3FB 50%,#FBF1E6 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:flutua 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:560px;height:560px;background:#9BE3BC;left:-140px;top:80px}
.bg i:nth-child(2){width:500px;height:500px;background:#A8D8F0;right:-120px;top:-120px;animation-delay:-6s}
.bg i:nth-child(3){width:420px;height:420px;background:#FFD3A5;right:15%;bottom:-160px;opacity:.5;animation-delay:-12s}
.bg i:nth-child(4){width:380px;height:380px;background:#C7F0D8;left:35%;top:45%;opacity:.45;animation-delay:-3s}
@keyframes flutua{to{transform:translate(60px,-40px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

.top{background:rgba(255,255,255,.45);backdrop-filter:var(--glass-b);-webkit-backdrop-filter:var(--glass-b);border-bottom:1px solid rgba(255,255,255,.8)}
.logo{box-shadow:0 6px 18px rgba(30,147,80,.35)}
.nav{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8)}
.nav button.on{background:#fff;color:var(--brand);box-shadow:0 2px 10px rgba(31,80,55,.12)}

.tile,.tile.dark,.fbar{background:var(--card);border:1px solid var(--line);backdrop-filter:var(--glass-b);-webkit-backdrop-filter:var(--glass-b);box-shadow:var(--sh);color:var(--txt)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 45%)}
.tile.heroT{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(200,240,218,.55) 55%,rgba(190,225,245,.45))}
.tile h3,.tile.dark h3{color:var(--sub)}
.click:hover{border-color:#fff;box-shadow:inset 0 1px 0 #fff,0 16px 40px rgba(31,80,55,.16)}
.head h2{background:linear-gradient(90deg,#0F5132,#1E9350 60%,#0E7490);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.9);backdrop-filter:blur(10px)}
.btn.pri{background:linear-gradient(135deg,#1E9350,#0E8A7E);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(30,147,80,.30)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}

.hero .lbl,.hero .cap,.ring .in span,.leg{color:var(--sub)}
.hero .big,.ring .in b{color:#0F2A1C}
.leg b{color:var(--txt)}
.stack{background:rgba(18,38,27,.08)}

.kpi .ico{background:color-mix(in srgb,var(--c) 16%,#fff);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 22%,transparent)}
.kpi .d{border-top-color:rgba(18,38,27,.08)}

.org+.org,.alert{border-top-color:rgba(18,38,27,.07)}
.org.click:hover,.dp:hover,.idr:hover,.loc:hover{background:rgba(255,255,255,.6)}
.mini,.dp .b,.stackL,.loc .lb{background:rgba(18,38,27,.07)}
.mv>div{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.mv>div div{background:none;border:0}
.mv .l,.mv .s{color:var(--sub)}
.sel,.fsel,.fdate,.search{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);color:var(--txt)}
.seg{background:rgba(18,38,27,.06)}
.seg button.on{background:#fff}
.finfo{border-top-color:rgba(18,38,27,.1)}

.ov{background:rgba(30,60,45,.18)}
.dr{background:rgba(245,250,247,.72);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border-left:1px solid #fff}
.dr-h{background:rgba(255,255,255,.55);border-bottom-color:rgba(18,38,27,.08)}
.ac{background:rgba(255,255,255,.65);border-color:#fff;box-shadow:0 2px 10px rgba(31,80,55,.06)}
.ac .obs{background:rgba(18,38,27,.04)}

.tile>*:not(.go){position:relative;z-index:1}
.tile::before{z-index:0}
.barra{cursor:pointer}.barra.vazia{cursor:default}
.barra .bar{transition:opacity .15s,filter .15s}
.barra:not(.vazia):hover .bar{filter:brightness(1.12) drop-shadow(0 2px 6px rgba(0,0,0,.18))}
svg:hover .barra:not(:hover) .bar{opacity:.55}
.mvc{cursor:pointer;transition:transform .15s,box-shadow .15s}
.mvc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,80,55,.12)}

/* ===== efeito "vem para frente" ao passar o mouse ===== */
.tile,.mvc,.org,.dp,.idr,.loc,.alert,.ac,.btn{transition:transform .28s cubic-bezier(.2,.9,.25,1.25),box-shadow .28s ease,background .2s ease,border-color .2s ease}
.tile.click:hover,.kpi:hover{transform:translateY(-8px) scale(1.025);z-index:5;background:rgba(255,255,255,.80);border-color:#fff;
  box-shadow:inset 0 1px 0 #fff,0 24px 50px -12px rgba(31,80,55,.30),0 10px 20px -8px rgba(31,80,55,.18)}
.kpi:hover .v{transform:scale(1.06);transform-origin:left center}
.kpi .v{transition:transform .28s cubic-bezier(.2,.9,.25,1.25)}
.kpi:hover::after{width:6px}
.mvc:hover{transform:translateY(-6px) scale(1.04);z-index:2;background:#fff !important;box-shadow:0 18px 36px -10px rgba(31,80,55,.28)}
.org.click:hover,.dp:hover,.idr:hover,.loc:hover,.alert:hover{transform:scale(1.025);background:rgba(255,255,255,.92) !important;
  box-shadow:0 12px 28px -10px rgba(31,80,55,.28);border-radius:12px;position:relative;z-index:2}
.alert:hover{padding-left:10px;padding-right:10px}
.ac:hover{transform:translateY(-3px) scale(1.012);background:#fff;box-shadow:0 14px 30px -12px rgba(31,80,55,.30)}
.btn:hover{transform:translateY(-2px)}
.barra .bar{transform-box:fill-box;transform-origin:bottom;transition:transform .25s cubic-bezier(.2,.9,.25,1.25),opacity .15s,filter .15s}
.barra:not(.vazia):hover .bar{transform:scaleX(1.35) scaleY(1.04)}
@media (prefers-reduced-motion:reduce){.tile,.mvc,.org,.dp,.idr,.loc,.alert,.ac,.btn,.barra .bar{transition:none}}

/* ===== ação expandida ===== */
.ac{cursor:pointer;position:relative;padding-right:40px}
.ac .chev{position:absolute;right:14px;bottom:12px;font-size:16px;color:var(--mute);transition:transform .25s}
.ac.open .chev{transform:rotate(180deg);color:var(--brand)}
.ac .obs{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ac.open .obs{display:none}
.ac.open{background:#fff;border-color:rgba(30,147,80,.35);box-shadow:0 18px 40px -14px rgba(31,80,55,.35);transform:none}
.ac-x{grid-column:1/-1;display:none;cursor:default}
.ac.open .ac-x{display:block;animation:abre .28s ease}
@keyframes abre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.situ{margin-top:12px;font-weight:700;font-size:14px;color:var(--c);display:flex;align-items:center;gap:8px}
.situ::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.tl{margin:12px 0 4px}
.tl-bar{display:flex;height:10px;border-radius:6px;background:rgba(18,38,27,.08);overflow:hidden}
.tl-in{height:100%;border-radius:6px 0 0 6px}
.tl-over{height:100%;background:repeating-linear-gradient(45deg,#E35D5D 0 6px,#F3A3A3 6px 12px)}
.tl-bar{position:relative;overflow:visible}
.tl-in{border-radius:6px 0 0 6px}
.tl-over{border-radius:0 6px 6px 0}
.tl-mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt);opacity:.55;border-radius:2px}
.tl-top,.tl-bot{position:relative;height:18px;font-size:11px;color:var(--sub)}
.tl-top{margin-bottom:4px}.tl-bot{margin-top:5px}
.tl-top span,.tl-bot span{position:absolute;white-space:nowrap}
.tl-top b,.tl-bot b{color:var(--txt);font-size:11.5px}
.tl-cap{font-size:12px;color:var(--sub);margin-top:4px}
.ac-x .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.ac-x .grid>div{background:rgba(18,38,27,.035);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ac-x .grid em{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600}
.ac-x .grid b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.ac-x .grid .pill{text-transform:none;letter-spacing:0;font-size:11px;align-self:flex-start}
.obsx{margin-top:12px;background:rgba(30,147,80,.06);border-left:3px solid var(--brand2);border-radius:8px;padding:10px 12px}
.obsx span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600}
.obsx p{font-size:13px;margin-top:4px;line-height:1.5;white-space:pre-wrap}
.acts{display:flex;align-items:center;gap:12px;margin-top:12px}
.acts .btn{padding:8px 14px;font-size:12.5px}
.copok{font-size:12px;color:var(--ok);font-weight:600}
@media(max-width:640px){.ac-x .grid{grid-template-columns:1fr 1fr}}

/* ===== faixa estilo bolsa ===== */
.ticker{display:flex;align-items:stretch;height:40px;border-top:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);overflow:hidden}
.ticker[hidden]{display:none}
.tk-lbl{flex:none;display:flex;align-items:center;gap:9px;padding:0 18px 0 32px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff;
  background:linear-gradient(90deg,#C2410C,#E08A1E);box-shadow:6px 0 16px rgba(0,0,0,.12);position:relative;z-index:2;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:28px}
.tk-lbl b{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:12px}
.tk-pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulso 1.4s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.tk-vp{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.tk-track{display:flex;width:max-content;height:100%;animation:corre 40s linear infinite}
.ticker:hover .tk-track{animation-play-state:paused}
@keyframes corre{to{transform:translateX(-50%)}}
.tk-half{display:flex;align-items:center;height:100%}
.tk{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:6px 12px;margin:0 4px;border-radius:9px;cursor:pointer;white-space:nowrap;font-family:inherit;font-size:12.5px;color:var(--txt);transition:background .15s,transform .15s}
.tk:hover{background:#fff;transform:scale(1.04);box-shadow:0 6px 16px rgba(31,80,55,.18)}
.tk-d{font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
.tk.u1 .tk-d{color:#DC2626}.tk.u2 .tk-d{color:#D97706}.tk.u3 .tk-d{color:#2563EB}
.tk-n{font-weight:700;color:var(--sub)}
.tk-t{font-weight:600}
.tk-r{color:var(--sub);font-size:11.5px}
.tk-sep{color:rgba(18,38,27,.25);font-size:9px;margin:0 6px}
@media (prefers-reduced-motion:reduce){.tk-track{animation-duration:200s !important}}
@media(max-width:640px){.tk-lbl{padding-left:16px;font-size:10.5px}.tk-r{display:none}}

/* ===== tempo para concluir ===== */
.tm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tm-v{font-size:15px;color:var(--sub);font-weight:600}
.tm-v span{font-size:44px;font-weight:700;color:var(--txt);line-height:1;margin-right:4px}
.tm-l{font-size:12px;color:var(--sub);margin-top:4px}
.tm-l b{color:var(--txt)}
.tm-p{text-align:right}
.tm-p .num{font-size:28px;font-weight:700;color:var(--ok)}
.tm-tend{font-size:12.5px;color:var(--sub);margin:12px 0 4px;padding:8px 12px;background:rgba(255,255,255,.55);border-radius:10px}
.tm-tend b{color:var(--txt)}
.tend{font-weight:700}.tend.ok{color:var(--ok)}.tend.bad{color:var(--atr)}
.tys{display:flex;gap:12px;align-items:flex-end;height:150px;margin-top:14px}

.drg-seg{border:0;padding:0;min-width:6px;color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:700;cursor:pointer;transition:filter .15s,opacity .2s}
.drg-seg:hover{filter:brightness(1.1)}
.drg-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.drg-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(18,38,27,.08);background:rgba(255,255,255,.8);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;color:var(--txt);cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s,opacity .2s}
.drg-chip i{width:9px;height:9px;border-radius:50%}
.drg-chip b{font-size:13px}
.drg-chip em{font-style:normal;color:var(--mute);font-size:11px;font-family:var(--mono)}
.drg-chip:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(31,80,55,.4)}
.drg-chip.on{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(30,147,80,.2);background:#fff}
.drg-b.off{opacity:.35}

.drg-b.drg-seg{flex-direction:row;align-items:center;justify-content:center;border-radius:0;padding:0;gap:0;box-shadow:none;transform:none;background-clip:padding-box}
.drg-b.drg-seg:hover{transform:none;box-shadow:none}
.drg-stack .drg-seg:first-child{border-radius:8px 0 0 8px}.drg-stack .drg-seg:last-child{border-radius:0 8px 8px 0}.drg-stack .drg-seg:only-child{border-radius:8px}
.drg-b.drg-chip{flex:none;flex-direction:row;align-items:center;padding:5px 11px;border-radius:20px;gap:7px}

/* ===== faixa de novidades (atualizações do plano) ===== */
.novb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 32px;border-top:1px solid rgba(255,255,255,.7);background:linear-gradient(90deg,rgba(30,147,80,.14),rgba(255,255,255,.35));font-size:13px}
.novb[hidden]{display:none}
.nv-lbl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.4px;font-size:12px}
.nv-dot{background:#D64545;color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px;border-radius:9px;padding:2px 7px;animation:pulsoN 1.6s ease-out infinite}
@keyframes pulsoN{0%{box-shadow:0 0 0 0 rgba(214,69,69,.6)}100%{box-shadow:0 0 0 9px rgba(214,69,69,0)}}
.nv-quando{color:var(--sub);font-size:12px}
.nv-chips{display:flex;gap:8px;flex-wrap:wrap}
.nv-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(18,38,27,.08);border-radius:20px;padding:4px 11px;font-weight:600;font-size:12.5px}
.nv-chip b{font-family:var(--mono)}
.nv-ver{margin-left:auto;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:10px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.nv-ver:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,122,68,.3)}
.ic-ok{color:var(--ok)}.ic-data{color:var(--and)}.ic-nova{color:var(--brand)}.ic-rem{color:var(--mute)}.ic-rea{color:var(--atr)}
.nv-dia{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:12px 12px 4px}
.nv-it{width:100%;display:grid;grid-template-columns:30px 54px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;font-family:inherit;color:var(--txt)}
.nv-it:hover{background:#fff;box-shadow:0 4px 14px rgba(31,80,55,.12)}
.nv-it[disabled]{cursor:default;opacity:.75}.nv-it[disabled]:hover{background:none;box-shadow:none}
.nv-ico{font-size:17px;font-weight:800;text-align:center}
.nv-n{font-weight:700;color:var(--sub);font-family:var(--mono);font-size:12.5px}
.nv-t{font-weight:600;font-size:13px;line-height:1.35}.nv-t small{display:block;color:var(--sub);font-weight:500;font-size:11.5px;margin-top:2px}
.nv-o{font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap}
@media(max-width:640px){.novb{padding:9px 14px}.nv-ver{margin-left:0}.nv-it{grid-template-columns:24px 1fr}.nv-n,.nv-o{grid-column:2}}
</style>
</head>

});

const temFiltro = () => !!(filtro.ano || filtro.mes.length || filtro.local.length || filtro.dep.length);
const temFiltroData = () => !!(filtro.ano || filtro.mes.length);
function passaLD(a){ return (!filtro.local.length || filtro.local.includes(a.local)) && (!filtro.dep.length || filtro.dep.includes(a.dep)); }
function passaData(a){
  if(!passaLD(a)) return false;
  if(!temFiltroData()) return true;
  const v = a.do; if(!v) return false;
  if(filtro.ano && v.slice(0,4)!==filtro.ano) return false;
  if(filtro.mes.length && !filtro.mes.includes(v.slice(5,7))) return false;
  return true;
}
const filtrar = L => L.filter(passaData);
const baseAcoes = () => ACOES.filter(a => filtro.hist || !a.hist);
const listaNomes = (arr, uni, plu) => arr.length===1 ? arr[0] : arr.length<=3 ? arr.join(', ') : `${arr.length} ${plu}`;
function nomesMeses(){ return filtro.mes.slice().sort().map(m=>MESES_N[+m-1]); }
function rotuloData(){
  if(filtro.mes.length){ const n = nomesMeses(); const m = n.length<=3 ? n.join(', ') : n.length+' meses'; return m + (filtro.ano?' de '+filtro.ano:''); }
  return filtro.ano ? 'ano '+filtro.ano : '';
}
function rotuloFiltro(){
  const p = [];
  if(filtro.mes.length) p.push(rotuloData() + (filtro.ano?'':' (todos os anos)'));
  else if(filtro.ano) p.push('Ano ' + filtro.ano);
  if(filtro.local.length) p.push('Local: '+listaNomes(filtro.local,'local','locais'));
  if(filtro.dep.length) p.push('Responsável: '+listaNomes(filtro.dep,'responsável','responsáveis'));
  return p.join(' · ');
}
function intervalo(){
  if(filtro.ano && filtro.mes.length===1){ const y=+filtro.ano, m=+filtro.mes[0]-1; return [new Date(y,m,1), new Date(Math.min(new Date(y,m+1,0), HOJE))]; }
  if(filtro.ano){ const y=+filtro.ano; return [new Date(y,0,1), new Date(Math.min(new Date(y,11,31), HOJE))]; }
  return null;
}

function movimentacao(L){
  const iv = intervalo();
  const fim = iv ? iv[1] : HOJE;
  const ini = iv ? new Date(iv[0]-DIA) : new Date(HOJE - periodo*DIA);
  const ant = new Date(ini - (fim-ini));
  const em = (s,a,b) => { const d=D(s); return d && d>a && d<=b; };
  const entL = L.filter(a=>em(a.do,ini,fim)), saiL = L.filter(a=>a.grupo==='concluida'&&em(a.term,ini,fim));
  const ent = entL.length, sai = saiL.length;
  const rotPer = iv ? 'em '+rotuloData() : ({30:'nos últimos 30 dias',90:'nos últimos 90 dias',180:'nos últimos 6 meses',365:'nos últimos 12 meses'})[periodo];
  ULT.mov = {ent:['Ações que entraram '+rotPer, entL], sai:['Ações concluídas '+rotPer, saiL]};
  const entA = L.filter(a=>em(a.do,ant,ini)).length, saiA = L.filter(a=>a.grupo==='concluida'&&em(a.term,ant,ini)).length;
  const sal = ent-sai, dif = (v,a)=>{const d=v-a; return `antes: ${a} (${d>0?'+':''}${d})`;};
  const ms=[]; let nm = 12, ref = fim;
  if(iv){ nm = Math.min(24, Math.max(1,(fim.getFullYear()-iv[0].getFullYear())*12 + fim.getMonth()-iv[0].getMonth()+1)); }
  for(let i=nm-1;i>=0;i--){const d=new Date(ref.getFullYear(),ref.getMonth()-i,1); ms.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,m:d.getMonth(),y:d.getFullYear()});}
  const MESL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  ms.forEach(x=>{ const eL=L.filter(a=>a.do&&a.do.startsWith(x.k)), sL=L.filter(a=>a.grupo==='concluida'&&a.term&&a.term.startsWith(x.k));
    x.e=eL.length; x.s=sL.length; const nm=MESL[x.m]+' de '+x.y;
    ULT.mov['e'+x.k]=['Entraram em '+nm, eL]; ULT.mov['s'+x.k]=['Concluídas em '+nm, sL]; });
  const W=560,H=150,pb=20,pt=14,mx=Math.max(1,...ms.map(x=>Math.max(x.e,x.s))),gw=W/ms.length,bw=gw*.3,sy=v=>(H-pb-pt)*v/mx;
  let g='';
  ms.forEach((x,i)=>{ const cx=gw*i+gw/2;
    [[x.e,'#E35D5D',cx-bw-1.5,'e','entraram'],[x.s,'#2BB673',cx+1.5,'s','concluídas']].forEach(([v,c,xx,tp,lb])=>{ const h=sy(v);
      g+=`<g class="barra${v?'':' vazia'}" ${v?`data-mv="${tp}${x.k}"`:''}><title>${MES[x.m]}/${String(x.y).slice(2)}: ${v} ${lb}${v?' — clique para ver':''}</title><rect class="hit" x="${xx-1}" y="${pt-4}" width="${bw+2}" height="${H-pb-pt+4}" fill="transparent"/><rect class="bar" x="${xx}" y="${H-pb-h}" width="${bw}" height="${Math.max(h,0)}" rx="3" fill="${c}"/></g>`;
      if(v) g+=`<text x="${xx+bw/2}" y="${H-pb-h-4}" font-size="10" fill="#3E5447" text-anchor="middle">${v}</text>`; });
    g+=`<text x="${cx}" y="${H-4}" font-size="10.5" fill="#6B8175" text-anchor="middle">${MES[x.m]}${(ms.length>12&&x.m===0)?' '+String(x.y).slice(2):''}</text>`; });
  return `<div class="tile dark c6"><h3>Movimentação de ações
      ${iv ? `<span class="sel" style="display:inline-block">${rotuloData()}</span>` : `<select class="sel" id="per">${[[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[180,'Últimos 6 meses'],[365,'Últimos 12 meses']].map(([v,l])=>`<option value="${v}" ${v===periodo?'selected':''}>${l}</option>`).join('')}</select>`}</h3>
    <div class="mv">
      <div class="mvc" data-mv="ent" title="Clique para ver as ações"><div class="l">↑ Entraram</div><div class="n num" style="color:#E35D5D">${ent}</div><div class="s">${dif(ent,entA)}</div></div>
      <div class="mvc" data-mv="sai" title="Clique para ver as ações"><div class="l">↓ Saíram (concluídas)</div><div class="n num" style="color:#2BB673">${sai}</div><div class="s">${dif(sai,saiA)}</div></div>
      <div><div class="l">Saldo</div><div class="n num" style="color:${sal>0?'#D64545':'#1E9350'}">${sal>0?'+':''}${sal}</div><div class="s">${sal>0?'pendências crescendo':sal<0?'pendências diminuindo':'estável'}</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:18px;font-family:var(--mono)">${g}</svg>
    <div class="leg" style="margin-top:6px"><span><i style="background:#E35D5D"></i>Entraram</span><span><i style="background:#2BB673"></i>Saíram</span><span style="margin-left:auto">clique numa barra para ver as ações · ${iv ? rotuloData() : 'últimos 12 meses'}</span></div>
  </div>`;
}

  const B = escopoAba();
  const anos = [...new Set(B.map(a=>a.do).filter(Boolean).map(v=>v.slice(0,4)))].sort();
  const comData = B.filter(passaLD).filter(a => (!filtro.ano || (a.do||'').startsWith(filtro.ano)));
  const mesesCom = new Set(comData.map(a=>(a.do||'').slice(5,7)).filter(Boolean));
  const locs = [...new Set(B.map(a=>a.local).filter(Boolean))].sort();
  const deps = [...new Set(B.map(a=>a.dep).filter(Boolean))].sort();
  const nHist = ACOES.filter(a=>a.hist && (aba==='geral'||aba==='planilha'||a.o===aba)).length;
  const semData = temFiltroData() ? B.filter(a=>!a.do).length : 0;
  return `<div class="fbar">
    <div class="fgrp"><span class="flb">Ano</span>
      <div class="seg"><button class="${!filtro.ano?'on':''}" data-ano="">Todos</button>${anos.map(y=>`<button class="${filtro.ano===y?'on':''}" data-ano="${y}">${y}</button>`).join('')}</div></div>
    <div class="fgrp"><span class="flb">Mês</span>${msel('mes','Todos os meses',MESES_N.map((m,i)=>{ const v=String(i+1).padStart(2,'0'); return {v, l:m, dis:!mesesCom.has(v)}; }),filtro.mes,false)}</div>
    <div class="fgrp"><span class="flb">Local</span>${msel('local','Todos os locais',locs.map(l=>({v:l,l})),filtro.local,true)}</div>
    <div class="fgrp"><span class="flb">Responsável</span>${msel('dep','Todos os responsáveis',deps.map(d=>({v:d,l:d})),filtro.dep,true)}</div>
    ${temFiltro() ? `<button class="flimpa" id="fLimpa">✕ Limpar filtro</button>` : ''}
    ${temFiltro() ? `<div class="finfo">Filtrando: <b>${esc(rotuloFiltro())}</b>${temFiltroData()?' · pela data de origem':''}${semData?` · ${semData} ${semData===1?'ação':'ações'} sem data de origem ${semData===1?'fica':'ficam'} de fora`:''}</div>` : ''}
  </div>`;
}

function msel(key, todos, opts, sel, busca){
  const n = sel.length;
  const nomes = opts.filter(o=>sel.includes(o.v)).map(o=>o.l);
  const rot = !n ? todos : n===1 ? nomes[0] : n===2 && (nomes[0]+nomes[1]).length<26 ? nomes.join(', ') : `${n} selecionados`;
  return `<div class="ms ${n?'ativo':''}" data-ms="${key}">
    <button type="button" class="ms-b" title="${esc(nomes.join(', '))}"><span>${esc(rot)}</span>${n?`<b class="ms-n">${n}</b>`:''}<i>▾</i></button>
    <div class="ms-p" hidden>
      ${busca?`<input type="search" class="ms-q" placeholder="Buscar…">`:''}
      <div class="ms-acts"><button type="button" data-a="all">Marcar todos</button><button type="button" data-a="none">Limpar</button></div>
      <div class="ms-l">${opts.map(o=>`<label class="${o.dis?'dis':''}" data-t="${esc(norm(o.l))}"><input type="checkbox" value="${esc(o.v)}" ${sel.includes(o.v)?'checked':''} ${o.dis&&!sel.includes(o.v)?'disabled':''}><span>${esc(o.l)}</span></label>`).join('')}</div>
      <div class="ms-f"><span class="ms-c"></span><button type="button" class="ms-ok">Aplicar</button></div>
    </div></div>`;
}
let MS_ABERTO = null;
function aplicarMS(el){
  const key = el.dataset.ms;
  const vals = [...el.querySelectorAll('.ms-l input:checked')].map(i=>i.value);
  MS_ABERTO = null;
  const antes = JSON.stringify(filtro[key]);
  filtro[key] = vals;
  if(JSON.stringify(vals)!==antes) render(); else el.querySelector('.ms-p').hidden = true, el.classList.remove('open');
}
function ligarMS(){
  document.querySelectorAll('.ms').forEach(el => {
    const p = el.querySelector('.ms-p'), cont = () => { const k = el.querySelectorAll('.ms-l input:checked').length; el.querySelector('.ms-c').textContent = k ? k+' marcado'+(k>1?'s':'') : 'nenhum = todos'; };
    el.querySelector('.ms-b').onclick = e => { e.stopPropagation();
      if(MS_ABERTO && MS_ABERTO!==el) aplicarMS(MS_ABERTO);
      if(!p.hidden){ aplicarMS(el); return; }
      p.hidden = false; el.classList.add('open'); MS_ABERTO = el; cont(); const q = el.querySelector('.ms-q'); if(q) setTimeout(()=>q.focus(),20); };
    el.querySelectorAll('.ms-l input').forEach(i => i.onchange = cont);
    el.querySelector('[data-a="all"]').onclick = () => { el.querySelectorAll('.ms-l label').forEach(l => { if(l.style.display!=='none'){ const i=l.querySelector('input'); if(!i.disabled) i.checked = true; } }); cont(); };
    el.querySelector('[data-a="none"]').onclick = () => { el.querySelectorAll('.ms-l input').forEach(i => i.checked = false); cont(); };
    el.querySelector('.ms-ok').onclick = () => aplicarMS(el);
    const q = el.querySelector('.ms-q');
    if(q){ q.oninput = () => { const s = norm(q.value); el.querySelectorAll('.ms-l label').forEach(l => l.style.display = !s || l.dataset.t.includes(s) ? '' : 'none'); };
      q.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); aplicarMS(el); } }; }
  });
}
document.addEventListener('mousedown', e => { if(MS_ABERTO && !MS_ABERTO.contains(e.target)) aplicarMS(MS_ABERTO); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && MS_ABERTO){ const el=MS_ABERTO; MS_ABERTO=null; el.querySelector('.ms-p').hidden=true; el.classList.remove('open'); } });

function ligarFiltro(){
  document.querySelectorAll('[data-ano]').forEach(b => b.onclick = () => { filtro.ano = b.dataset.ano; render(); });
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onchange = fn; };
  ligarMS();
  on('fHist', e => { filtro.hist = e.target.checked; render(); });
  const lp = document.getElementById('fLimpa'); if(lp) lp.onclick = () => { filtro = {...filtro, ano:'', mes:[], local:[], dep:[]}; render(); };
}

const FAIXAS = [['ate90','Até 3 meses',0,90,'#F2C14E'],['90a180','3 a 6 meses',90,180,'#EE9B3B'],['180a365','6 meses a 1 ano',180,365,'#E5703A'],['mais365','Mais de 1 ano',365,1e9,'#C93C3C']];
const idade = a => a.do ? Math.round((HOJE-D(a.do))/DIA) : null;
let ULT = {faixas:{}, locais:{}, mov:{}, tempo:{}};

function idadeTile(L, span){
  const P = L.filter(a=>a.grupo!=='concluida'), tot = P.length;
  const sem = P.filter(a=>idade(a)===null);
  ULT.faixas = {};

/* ---------- tempo para concluir ---------- */
function tempoTile(L, span){
  const C = L.filter(a => a.grupo==='concluida' && a.do && a.term)
    .map(a => ({a, d: Math.max(0, Math.round((D(a.term)-D(a.do))/DIA))}));
  const media = arr => arr.length ? Math.round(arr.reduce((s,x)=>s+x.d,0)/arr.length) : null;
  const mediana = arr => { if(!arr.length) return null; const v=arr.map(x=>x.d).sort((a,b)=>a-b); return v[Math.floor(v.length/2)]; };
  const m = media(C), md = mediana(C);
  const noPrazo = L.filter(a=>a.s==='executada').length, conc = L.filter(a=>a.grupo==='concluida').length;
  const a12 = new Date(HOJE - 365*DIA), a24 = new Date(HOJE - 730*DIA);
  const ult = C.filter(x => D(x.a.term) > a12), ant = C.filter(x => D(x.a.term) > a24 && D(x.a.term) <= a12);
  const mu = media(ult), ma = media(ant);
  let tend = '';
  if(mu!==null && ma!==null){
    const df = mu - ma;
    tend = df<0 ? `<span class="tend ok">▼ ${-df} dias mais rápido</span> que nos 12 meses anteriores (${ma} dias)`
         : df>0 ? `<span class="tend bad">▲ ${df} dias mais lento</span> que nos 12 meses anteriores (${ma} dias)`
         : `igual aos 12 meses anteriores`;
  }
  const anos = {}; C.forEach(x => { const y = x.a.term.slice(0,4); (anos[y] ??= []).push(x); });
  ULT.tempo = {};
  const ys = Object.keys(anos).sort();
  const mx = Math.max(1, ...ys.map(y => media(anos[y])));
  const barras = ys.map(y => { const v = media(anos[y]); ULT.tempo[y] = ['Concluídas em '+y, anos[y].map(x=>x.a)];
    return `<div class="ty" data-ano-conc="${y}" title="${anos[y].length} ações concluídas em ${y} · clique para ver">
      <b class="num">${v}</b><div class="tyb"><span style="height:${v*100/mx}%"></span></div><em>${y}</em><small>${anos[y].length} ações</small></div>`; }).join('');
  return `<div class="tile ${span}"><h3>Tempo para concluir uma ação <small>da data de origem até o término</small></h3>
    ${C.length ? `<div class="tm-top">
        <div><div class="tm-v"><span class="num">${m}</span> dias</div><div class="tm-l">tempo médio${md!==null?` · metade conclui em até <b>${md}</b> dias`:''}</div></div>
        <div class="tm-p"><div class="num">${pct(noPrazo,conc)}%</div><div class="tm-l">concluídas<br>no prazo</div></div>
      </div>
      ${mu!==null?`<div class="tm-tend">Últimos 12 meses: <b>${mu} dias</b>${tend?' · '+tend:''}</div>`:''}
      <div class="tys">${barras}</div><div class="tm-l" style="margin-top:6px">média de dias por ano de conclusão · clique numa barra para ver as ações</div>`
      : '<div class="empty">Ainda não há ações concluídas com datas completas.</div>'}
  </div>`;
}

/* ---------- pesquisa global ---------- */
let PQ = null;
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function pesquisar(){
  if(!PQ){
    PQ = document.createElement('div'); PQ.className='pq';
    PQ.innerHTML = `<div class="pq-box" role="dialog" aria-label="Pesquisar ações">
      <div class="pq-in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="pqI" type="search" placeholder="Nº da ação, responsável, setor/local ou palavra da descrição…" autocomplete="off"><kbd>Esc</kbd></div>
      <div class="pq-dica">Dica: digite só o número para achar a ação (ex.: <b>8</b>), ou um setor como <b>expedição</b>, <b>caldeira</b>, <b>manutenção mec</b>.</div>
      <div class="pq-res" id="pqR"></div></div>`;
    document.body.appendChild(PQ);
    PQ.onclick = e => { if(e.target===PQ) fecharPQ(); };
    const inp = PQ.querySelector('#pqI');
    inp.oninput = () => buscaPQ(inp.value);
    inp.onkeydown = e => {
      const it = [...PQ.querySelectorAll('.pq-it')]; let k = it.findIndex(x=>x.classList.contains('sel'));
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!it.length) return; it[k]?.classList.remove('sel'); k = e.key==='ArrowDown' ? Math.min(it.length-1,k+1) : Math.max(0,k-1); it[k].classList.add('sel'); it[k].scrollIntoView({block:'nearest'}); }
      else if(e.key==='Enter'){ const s = it[k>=0?k:0]; if(s) s.click(); }
      else if(e.key==='Escape'){ fecharPQ(); }
    };
  }
  PQ.classList.add('on'); const inp = PQ.querySelector('#pqI'); inp.value=''; buscaPQ(''); setTimeout(()=>inp.focus(),30);
}
function fecharPQ(){ if(PQ) PQ.classList.remove('on'); }
function buscaPQ(q){
  const R = PQ.querySelector('#pqR'); const qn = norm(q).trim();
  if(!qn){ R.innerHTML = '<div class="pq-vazio">Comece a digitar para pesquisar entre todas as '+ACOES.length+' ações.</div>'; return; }
  const termos = qn.split(/\s+/);
  const soNum = /^h?\d+$/.test(qn);
  let L = ACOES.map(a => {
    const num = norm(a.n), dep = norm(a.dep), loc = norm(a.local), desc = norm(a.desc), obs = norm(a.obs);
    let sc = 0;
    if(soNum){ if(num===qn) sc=100; else if(num.startsWith(qn)) sc=50; else return null; }
    else {
      for(const tm of termos){
        let s = 0;
        if(dep.includes(tm)) s = Math.max(s, 30); if(loc.includes(tm)) s = Math.max(s, 30);
        if(desc.includes(tm)) s = Math.max(s, 15); if(obs.includes(tm)) s = Math.max(s, 5);
        if(!s) return null; sc += s;
      }
    }
    return {a, sc};
  }).filter(Boolean).sort((x,y)=> y.sc-x.sc || (ordemSt(x.a)-ordemSt(y.a)));
  const tot = L.length; L = L.slice(0,60);
  const hl = s => { s = String(s??''); if(soNum) return esc(s);
    const ns = norm(s); if(ns.length!==s.length) return esc(s);
    const marca = new Array(s.length).fill(false);
    termos.forEach(tm => { if(tm.length<2) return; let i = ns.indexOf(tm); while(i>=0){ for(let k=i;k<i+tm.length;k++) marca[k]=true; i = ns.indexOf(tm,i+tm.length); } });
    let h='', on=false; for(let k=0;k<s.length;k++){ if(marca[k]&&!on){h+='<mark>';on=true;} if(!marca[k]&&on){h+='</mark>';on=false;} h+=esc(s[k]); } return on?h+'</mark>':h; };
  R.innerHTML = tot ? `<button class="pq-all" type="button">Ver as ${tot} ações encontradas na lista →</button>` + L.map(({a})=>{ const [st,cl]=STX[a.s];
      return `<button class="pq-it" type="button" data-n="${esc(a.n)}"><span class="pq-n num">${esc(a.n)}</span>
        <span class="pq-t"><b>${hl(a.desc)}</b><small>${hl(a.dep)}${a.local?' · '+hl(a.local):''} · ${ORIGENS[a.o].nome}${(a.fotos||[]).length?' · 📷':''}</small></span>
        <span class="pill ${cl}">${st}</span></button>`; }).join('')
    : `<div class="pq-vazio">Nenhuma ação encontrada para "<b>${esc(q)}</b>".</div>`;
  R.querySelectorAll('.pq-it').forEach(b => b.onclick = () => {
    const a = ACOES.find(x=>String(x.n)===b.dataset.n); fecharPQ();
    gaveta('Ação nº '+a.n, [a], 'todas', ''); expandir(document.querySelector('#lista .ac'));
  });
  const all = R.querySelector('.pq-all'); if(all) all.onclick = () => { const res = ACOES.filter(x => R._ids.has(String(x.n))); fecharPQ(); gaveta('Pesquisa: "'+q+'"', res, 'todas', ''); };
  R._ids = new Set(ACOES.map(a=>a).filter(a => { const num=norm(a.n); if(soNum) return num.startsWith(qn); const blob=norm(a.dep+' '+a.local+' '+a.desc+' '+a.obs); return termos.every(tm=>blob.includes(tm)); }).map(a=>String(a.n)));
}
const ordemSt = a => ({atrasada:0, sem_data:1, andamento:2, exec_atraso:3, executada:4})[a.s];
document.getElementById('sbtn').onclick = pesquisar;
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); pesquisar(); }
  if(e.key==='Escape'){ fecharPQ(); if(LB) LB.classList.remove('on'); }
});

/* ---------- aba Lista completa (formato planilha) ---------- */
let TB = {q:'', o:'', st:'', dep:'', local:'', k:'n', asc:true};
const COLS = [
  ['n','Nº'],['o','Origem'],['do','Data origem'],['desc','Ação / atividade'],['local','Local'],['dep','Responsável'],
  ['prev','Data prevista'],['term','Real data término'],['s','Status'],['obs','Observações']];
const ST_FILTRO = {'':'Todos os status', abertas:'Abertas (pendentes)', concluidas:'Concluídas', andamento:'Em andamento', atraso:'Em atraso', semdata:'Sem data definida'};
const numN = n => { const s=String(n); return s[0]==='H' ? 100000+parseInt(s.slice(1)) : +s; };
function linhasPlanilha(){
  const q = norm(TB.q).trim(), termos = q ? q.split(/\s+/) : [];
  let L = escopo().filter(a =>
    (!TB.o || a.o===TB.o) && (!TB.dep || a.dep===TB.dep) && (!TB.local || a.local===TB.local) &&
    (!TB.st || (TB.st==='abertas' ? a.grupo!=='concluida' : TB.st==='concluidas' ? a.grupo==='concluida' : a.grupo===TB.st)) &&
    (!termos.length || termos.every(tm => norm(a.n+' '+a.desc+' '+a.local+' '+a.dep+' '+a.obs+' '+ORIGENS[a.o].nome).includes(tm))));
  const k = TB.k, dir = TB.asc ? 1 : -1;
  const val = a => k==='n' ? numN(a.n) : k==='o' ? ORIGENS[a.o].nome : k==='s' ? ordemSt(a) : (a[k] ?? '');
  return L.sort((x,y) => { const a=val(x), b=val(y); if(a===''&&b!=='') return 1; if(b===''&&a!=='') return -1; return (a>b?1:a<b?-1:0)*dir || numN(x.n)-numN(y.n); });
}

  [['plO','o'],['plS','st']].forEach(([id,k]) => on(id,'onchange', e => { TB[k] = e.target.value; renderPlanilha(); }));

function corpoPlanilha(){
  const L = linhasPlanilha(); TB.vis = L;
  document.getElementById('plN').textContent = `${L.length} ${L.length===1?'ação':'ações'}`;
  document.getElementById('plB').innerHTML = L.length ? L.map((a,i) => { const [st,cl] = STX[a.s];

      <td class="c-desc">${(a.fotos||[]).length?'<span class="tag foto">📷</span>':''}${a.hist?'<span class="tag hist">Hist.</span>':''}${esc(a.desc)}</td>
      <td>${esc(a.local)||'—'}</td><td>${esc(a.dep)}</td>
      <td class="num" style="${a.s==='atrasada'?'color:var(--atr);font-weight:700':''}">${a.prev?fmt(a.prev):'<span class="sd">a definir</span>'}</td>
      <td class="num">${fmt(a.term)}</td>
      <td><span class="pill ${cl}">${st}${a.s==='atrasada'?' · '+a.diasAtraso+'d':''}</span></td>
      <td class="c-obs" title="${esc(a.obs)}"><div>${esc(a.obs)||'—'}</div></td><td class="c-go"><span>Abrir ›</span></td></tr>`; }).join('')
    : `<tr><td colspan="${COLS.length+1}" class="empty">Nenhuma ação com esses filtros.</td></tr>`;
  document.querySelectorAll('#plB tr[data-i]').forEach(tr => tr.onclick = () => {
    const a = TB.vis[+tr.dataset.i]; gaveta('Ação nº '+a.n, [a], 'todas', ''); expandir(document.querySelector('#lista .ac'));
  });
}
function tabelaTexto(sep){
  const cab = ['Nº','Origem','Data origem','Ação / atividade','Local','Responsável','Data prevista','Real data término','Status','Dias em atraso','Observações'];
  const cel = v => { v = String(v??''); return sep===';' && /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v.replace(/[\t\n]/g,' '); };
  const linhas = TB.vis.map(a => [a.n, ORIGENS[a.o].nome, fmt(a.do), a.desc, a.local, a.dep, a.prev?fmt(a.prev):'A DEFINIR', a.term?fmt(a.term):'', STX[a.s][0], a.diasAtraso??'', a.obs].map(cel).join(sep));
  return [cab.join(sep), ...linhas].join('\r\n');
}
function msgPl(t){ const m=document.getElementById('plMsg'); m.textContent=t; setTimeout(()=>m.textContent='',4000); }
function baixarCSV(){
  try{
    const blob = new Blob(['﻿'+tabelaTexto(';')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `acoes_sesmt_${HOJE.toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    msgPl(` · arquivo baixado (${TB.vis.length} linhas) — abre direto no Excel`);
  }catch(e){ msgPl(' · não foi possível baixar aqui; use "Copiar tabela" e cole no Excel'); }
}
async function copiarTabela(){
  try{ await navigator.clipboard.writeText(tabelaTexto('\t')); msgPl(` · ${TB.vis.length} linhas copiadas — cole no Excel com Ctrl+V`); }
  catch(e){ msgPl(' · não foi possível copiar neste navegador'); }
}

      <tbody>${linhas.map(linha).join('')}</tbody>

/* ---------- gaveta de ações ---------- */
const SIT = {todas:'Todas', abertas:'Abertas', concluidas:'Concluídas'};
function abrir(tipo, dep=''){
  const L = escopo();
  const nomes = {todas:'Todas as ações', concluida:'Ações concluídas', pendente:'Ações pendentes', andamento:'Ações em andamento', atraso:'Ações em atraso', semdata:'Ações sem data definida'};
  let base = L, sit = 'todas';
  if(tipo==='concluida') sit='concluidas';
  else if(tipo==='pendente') sit='abertas';
  else if(tipo==='andamento'||tipo==='atraso'||tipo==='semdata') base = L.filter(a=>a.grupo===tipo);
  gaveta(nomes[tipo], base, sit, dep);
}
function gaveta(titulo, base, sit, dep){
  dw = {titulo, base, sit, dep, q:'', orig:'', st:''};
  document.getElementById('busca').value='';
  document.getElementById('drT').textContent = titulo;
  document.getElementById('drS').textContent = (!ORIGENS[aba] ? 'Todas as origens' : ORIGENS[aba].nome) + (temFiltro() ? ' · '+rotuloFiltro() : '');
  const deps = [...new Set(base.map(a=>a.dep))].sort();
  document.getElementById('fDep').innerHTML = `<option value="">Todos os departamentos</option>` + deps.map(d=>`<option ${d===dep?'selected':''}>${esc(d)}</option>`).join('');
  const origs = ABAS_ORIGEM.filter(k => base.some(a=>a.o===k));
  const fo = document.getElementById('fOrig');
  fo.innerHTML = `<option value="">Todas as origens (${base.length})</option>` + origs.map(k=>`<option value="${k}">${ORIGENS[k].nome} (${base.filter(a=>a.o===k).length})</option>`).join('');
  fo.style.display = origs.length>1 ? '' : 'none';
  lista();
  document.getElementById('dr').classList.add('on'); document.getElementById('ov').classList.add('on');
}
function fechar(){ document.getElementById('dr').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }
function graficoGaveta(L){
  const el = document.getElementById('drG');
  const ordemSt = [['atrasada','Atrasada'],['sem_data','Sem data definida'],['andamento','Em andamento'],['exec_atraso','Concluída c/ atraso'],['executada','Concluída']];
  const tot = L.length;
  const it = ordemSt.map(([s,l]) => ({s, l, v: L.filter(a=>a.s===s).length})).filter(x => x.v);
  if(!tot || (it.length===1 && !dw.st)){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="drg">
    <div class="drg-h"><b>Ações por status · ${tot}</b><span>${dw.st ? 'filtrando: <b>'+ordemSt.find(x=>x[0]===dw.st)[1]+'</b> · <a href="#" id="drgX">mostrar todas</a>' : 'clique num status para filtrar a lista'}</span></div>
    <div class="drg-stack">${it.map(x => `<button type="button" class="drg-b drg-seg ${dw.st&&dw.st!==x.s?'off':''}" data-st="${x.s}" title="${x.l}: ${x.v} (${pct(x.v,tot)}%)" style="flex:${x.v};background:${COR_ST[x.s]}">${x.v*100/tot>=8?x.v:''}</button>`).join('')}</div>
    <div class="drg-chips">${it.map(x => `<button type="button" class="drg-b drg-chip ${dw.st===x.s?'on':''} ${dw.st&&dw.st!==x.s?'off':''}" data-st="${x.s}">
      <i style="background:${COR_ST[x.s]}"></i>${x.l}<b class="num">${x.v}</b><em>${pct(x.v,tot)}%</em></button>`).join('')}</div></div>`;
  el.querySelectorAll('.drg-b').forEach(b => b.onclick = () => { dw.st = dw.st===b.dataset.st ? '' : b.dataset.st; lista(); });
  const x = el.querySelector('#drgX'); if(x) x.onclick = e => { e.preventDefault(); dw.st=''; lista(); };
}
function lista(){
  const porDep = dw.base.filter(a=>(!dw.dep||a.dep===dw.dep) && (!dw.orig||a.o===dw.orig));
  const n = {todas:porDep.length, abertas:porDep.filter(a=>a.grupo!=='concluida').length, concluidas:porDep.filter(a=>a.grupo==='concluida').length};
  document.getElementById('seg').innerHTML = Object.entries(SIT).map(([k,l])=>`<button class="${dw.sit===k?'on':''}" data-s="${k}">${l}<span class="k">${n[k]}</span></button>`).join('');
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ dw.sit=b.dataset.s; lista(); });
  const q = dw.q.toLowerCase();
  const ordem = {atrasada:0, sem_data:1, andamento:2, exec_atraso:3, executada:4};
  const L0 = porDep.filter(a => (dw.sit==='todas' || (dw.sit==='abertas' ? a.grupo!=='concluida' : a.grupo==='concluida'))

  graficoGaveta(L0);
  const L = L0.filter(a => !dw.st || a.s===dw.st)
    .sort((a,b)=> ordem[a.s]-ordem[b.s] || (b.diasAtraso??0)-(a.diasAtraso??0) || String(b.term||a.prev||'').localeCompare(String(a.term||b.prev||'')));
  document.getElementById('cnt').textContent = `${L.length} ${L.length===1?'ação':'ações'}` + (dw.dep?` · ${dw.dep}`:'');
  dw.vis = L;
  document.getElementById('lista').innerHTML = L.length ? L.map((a,idx) => {
    const [st,cl] = STX[a.s];

    const ab = a.grupo!=='concluida' && idade(a)!==null ? `<span>Aberta há <b class="num">${idade(a)}</b> dias</span>` : '';
    return `<div class="ac" data-i="${idx}" tabindex="0" role="button" aria-expanded="false">
      <div class="ttl">${!ORIGENS[aba]?`<span class="tag">${ORIGENS[a.o].nome}</span>`:''}${a.hist?'<span class="tag hist">Histórico</span>':''}${(a.fotos||[]).length?`<span class="tag foto">📷 ${a.fotos.length}</span>`:''}${esc(a.desc)}</div>
      <span class="pill ${cl}">${st}${extra}</span>
      <div class="meta"><span>Nº <b class="num">${a.n}</b></span><span>Responsável <b>${esc(a.dep)}</b></span>${a.local?`<span>Local <b>${esc(a.local)}</b></span>`:''}
        <span>Origem <b class="num">${fmt(a.do)}</b></span><span>Prevista <b class="num" style="${a.s==='atrasada'?'color:var(--atr)':''}">${a.prev?fmt(a.prev):'sem data'}</b></span>${a.term?`<span>Término <b class="num">${fmt(a.term)}</b></span>`:''}${ab}</div>
      ${a.obs?`<div class="obs">${esc(a.obs)}</div>`:''}
      <div class="ac-x"></div>
      <span class="chev" aria-hidden="true">⌄</span></div>`;
  }).join('') : '<div class="empty">Nenhuma ação encontrada.</div>';
  document.querySelectorAll('#lista .ac').forEach(el => {
    const tog = e => { if(e.target.closest('.ac-x')) return; expandir(el); };
    el.onclick = tog;
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); expandir(el); } };
  });
}

function detalhe(a){
  const [st,cl] = STX[a.s];
  const dO=D(a.do), dP=D(a.prev), dT=D(a.term), ref = dT || HOJE;
  const dias = (x,y) => Math.round((y-x)/DIA);
  let situ, cor;
  if(a.s==='executada'){ { const ad = dP&&dT ? dias(dT,dP) : null; situ = ad===null ? 'Concluída no prazo' : ad===0 ? 'Concluída exatamente no prazo' : `Concluída ${ad} ${ad===1?'dia':'dias'} antes do prazo`; } cor='var(--ok)'; }
  else if(a.s==='exec_atraso'){ situ=`Concluída com ${dias(dP,dT)} dias de atraso`; cor='var(--warn)'; }
  else if(a.s==='atrasada'){ situ=`Vencida há ${a.diasAtraso} dias`; cor='var(--atr)'; }
  else if(a.s==='andamento'){ situ=`Faltam ${dias(HOJE,dP)} dias para o prazo`; cor='var(--and)'; }
  else { situ='Sem data prevista definida'; cor='var(--warn)'; }
  // linha do tempo
  let tl='';
  if(dO && dP && dP>dO){
    const tot = dias(dO,dP), usado = Math.max(0,dias(dO,ref)), mx = Math.max(tot,usado,1);
    const pPlan = tot*100/mx, pHoje = usado*100/mx;
    const dentro = Math.min(pHoje,pPlan), fora = Math.max(0,pHoje-pPlan);
    const pos = v => v>88 ? `right:${100-v}%;text-align:right` : v<12 ? `left:${v}%` : `left:${v}%;transform:translateX(-50%);text-align:center`;
    tl = `<div class="tl">
      <div class="tl-top"><span style="${pos(pPlan)}">Prazo <b class="num">${fmt(a.prev)}</b></span></div>
      <div class="tl-bar"><span class="tl-in" style="width:${dentro}%;background:${cor}"></span><span class="tl-over" style="width:${fora}%"></span><i class="tl-mk" style="left:${pPlan}%"></i></div>
      <div class="tl-bot"><span style="left:0">Origem <b class="num">${fmt(a.do)}</b></span><span style="${pos(pHoje)}">${dT?'Término':'Hoje'} <b class="num">${fmt(dT?a.term:HOJE.toISOString().slice(0,10))}</b></span></div>
      <div class="tl-cap">${Math.min(usado,tot)} de ${tot} dias do prazo usados${usado>tot?` · <b style="color:var(--atr)">${usado-tot} dias além do prazo</b>`:''}</div></div>`;
  } else if(dO){
    tl = `<div class="tl"><div class="tl-cap">${dT?`Concluída em ${dias(dO,dT)} dias após a abertura`:`Aberta há ${dias(dO,HOJE)} dias · sem prazo definido`}</div></div>`;
  }
  const campo = (l,v) => `<div><em>${l}</em><b>${v}</b></div>`;
  return `<div class="situ" style="--c:${cor}">${situ}</div>
    ${tl}
    <div class="grid">
      ${campo('Nº da ação', `<span class="num">${a.n}</span>`)}
      ${campo('Origem', ORIGENS[a.o].nome + (a.hist?' (histórico)':''))}
      ${campo('Responsável', esc(a.dep))}
      ${campo('Local', esc(a.local)||'—')}
      ${campo('Data de origem', `<span class="num">${fmt(a.do)}</span>`)}
      ${campo('Data prevista', a.prev?`<span class="num">${fmt(a.prev)}</span>`:'sem data')}
      ${campo('Data de término', a.term?`<span class="num">${fmt(a.term)}</span>`:'—')}
      ${campo('Status', `<span class="pill ${cl}">${st}</span>`)}
    </div>
    <div class="fotos"><span>Registro fotográfico</span>${(a.fotos||[]).length
        ? `<div class="fgrid">${a.fotos.map((f,i)=>`<button type="button" class="fth" data-fi="${i}"><img src="${f}" alt="Foto ${i+1} da ação ${a.n}" loading="lazy"><i>🔍</i></button>`).join('')}</div>`
        : `<div class="fvazio">Nenhuma foto registrada. Para anexar, salve a foto na pasta <b>fotos/</b> com o nº da ação no nome (ex.: <b>${a.n}.jpg</b>, <b>${a.n}-2.jpg</b>).</div>`}</div>
    <div class="obsx"><span>Observações / atualizações</span><p>${a.obs?esc(a.obs):'<i>Nenhuma observação registrada.</i>'}</p></div>
    <div class="acts"><button class="btn cop" type="button">Copiar resumo</button><span class="copok"></span></div>`;
}
function expandir(el){
  const abrir = !el.classList.contains('open');
  document.querySelectorAll('#lista .ac.open').forEach(o=>{ o.classList.remove('open'); o.setAttribute('aria-expanded','false'); o.querySelector('.ac-x').innerHTML=''; });
  if(!abrir) return;
  const a = dw.vis[+el.dataset.i];
  const x = el.querySelector('.ac-x');
  x.innerHTML = detalhe(a);
  el.classList.add('open'); el.setAttribute('aria-expanded','true');
  x.querySelectorAll('.fth').forEach(b => b.onclick = () => lightbox(a, +b.dataset.fi));
  x.querySelector('.cop').onclick = async () => {
    const [st] = STX[a.s];
    const txt = `*Ação nº ${a.n} – ${ORIGENS[a.o].nome}*\n${a.desc}\nResponsável: ${a.dep}${a.local?'\nLocal: '+a.local:''}\nOrigem: ${fmt(a.do)} · Prevista: ${a.prev?fmt(a.prev):'sem data'}${a.term?' · Término: '+fmt(a.term):''}\nStatus: ${st}${a.s==='atrasada'?' ('+a.diasAtraso+' dias)':''}${a.obs?'\nObs.: '+a.obs:''}`;
    const ok = x.querySelector('.copok');
    try { await navigator.clipboard.writeText(txt); ok.textContent='✓ Copiado — é só colar no WhatsApp ou e-mail'; }
    catch(e){ ok.textContent='Não foi possível copiar neste navegador'; }
    setTimeout(()=>ok.textContent='',3500);
  };
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}
document.getElementById('fDep').onchange = e => { dw.dep = e.target.value; lista(); };
document.getElementById('fOrig').onchange = e => { dw.orig = e.target.value; lista(); };
document.getElementById('busca').oninput = e => { dw.q = e.target.value; lista(); };
document.getElementById('drX').onclick = fechar;
document.getElementById('ov').onclick = fechar;
document.addEventListener('keydown', e => { if(e.key==='Escape') fechar(); });

/* início */
function relogio(){ const n=new Date(); document.getElementById('hoje').textContent = n.toLocaleDateString('pt-BR')+' · '+n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
relogio(); setInterval(relogio, 15000);
// recarrega a cada 30 min para buscar dados novos e recalcular atrasos (uso em TV)
setTimeout(() => location.reload(), 30*60*1000);
if(PACOTE.gerado_em) document.getElementById('atual').textContent = new Date(PACOTE.gerado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const h = (location.hash||'').slice(1).toUpperCase();
if(ABAS_ORIGEM.includes(h)) aba = h; else if(h==='PLANILHA') aba = 'planilha';
function abrirAcaoHash(){
  const m = (location.hash||'').match(/^#acao-(.+)$/i); if(!m) return false;
  const n = decodeURIComponent(m[1]).toUpperCase();
  const a = ACOES.find(x => String(x.n).toUpperCase()===n); if(!a) return false;
  gaveta('Ação nº '+a.n, [a], 'todas', ''); expandir(document.querySelector('#lista .ac')); return true;
}
window.addEventListener('hashchange', () => { if(abrirAcaoHash()) return; });
window.addEventListener('hashchange', () => { const k=(location.hash||'').slice(1).toUpperCase(); const n=ABAS_ORIGEM.includes(k)?k:(k==='PLANILHA'?'planilha':'geral'); if(n!==aba){aba=n;render();} });
render();
renderNovidades();
abrirAcaoHash();
</script>
